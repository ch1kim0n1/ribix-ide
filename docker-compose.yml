version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: ribix-postgres
    environment:
      POSTGRES_USER: ribix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ribix_password}
      POSTGRES_DB: ribix
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - ribix-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ribix"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis
  redis:
    image: redis:7-alpine
    container_name: ribix-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - ribix-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ribix Backend
  ribix-backend:
    build:
      context: ../ribix
      dockerfile: Dockerfile
    container_name: ribix-backend
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://ribix:${POSTGRES_PASSWORD:-ribix_password}@postgres:5432/ribix
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      RIBIX_API_URL: http://ribix-backend:3000
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - ribix-network
    restart: unless-stopped

  # Ribix Web (Dashboard)
  ribix-web:
    build:
      context: ../ribix-web
      dockerfile: Dockerfile
    container_name: ribix-web
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: http://ribix-backend:3000
      NEXT_PUBLIC_WS_URL: ws://ribix-websocket:1234
    ports:
      - "8080:3000"
    depends_on:
      - ribix-backend
    networks:
      - ribix-network
    restart: unless-stopped

  # Ribix IDE Web
  ribix-ide-web:
    build:
      context: .
      dockerfile: web-ide/Dockerfile
      target: production
    container_name: ribix-ide-web
    environment:
      NODE_ENV: production
      API_URL: http://ribix-backend:3000
      WS_URL: ws://ribix-websocket:1234
    ports:
      - "3001:3000"
    depends_on:
      - ribix-backend
    networks:
      - ribix-network
    restart: unless-stopped

  # WebSocket Server for Collaboration
  ribix-websocket:
    build:
      context: .
      dockerfile: web-ide/Dockerfile.websocket
    container_name: ribix-websocket
    environment:
      NODE_ENV: production
      WS_PORT: 1234
      REDIS_URL: redis://redis:6379
    ports:
      - "1234:1234"
    depends_on:
      - redis:
        condition: service_healthy
    networks:
      - ribix-network
    restart: unless-stopped

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: ribix-nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - ribix-web
      - ribix-ide-web
    networks:
      - ribix-network
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  ribix-network:
    driver: bridge