name: Build Release

on:
  push:
    tags:
      - 'v*'

# Required so softprops/action-gh-release can create/update the release and
# upload binaries; without it the upload fails with 403 "Resource not
# accessible by integration".
permissions:
  contents: write

jobs:
  build-macos:
    name: Build macOS (arm64 + x64)
    runs-on: macos-latest
    strategy:
      matrix:
        arch: [arm64, x64]
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # Skip the TS->TS export mangler for release builds. It is a size optimization
      # only and a dependency .d.ts (google-auth-library) can crash it with OVERLAPPING edit.
      RIBIX_DISABLE_MANGLE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # @vscode/ripgrep downloads its binary from GitHub releases during
          # postinstall; without a token GitHub rate-limits with HTTP 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build React components
        run: npm run buildreact

      - name: Clean incremental build state
        run: find . -name '*.tsbuildinfo' -delete || true

      - name: Build macOS app (${{ matrix.arch }})
        run: node ./node_modules/gulp/bin/gulp.js vscode-darwin-${{ matrix.arch }}-min
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create DMG
        run: |
          APP_NAME="Ribix IDE"
          ARCH="${{ matrix.arch }}"
          mkdir -p dist
          hdiutil create -volname "$APP_NAME" \
            -srcfolder "../VSCode-darwin-${ARCH}/${APP_NAME}.app" \
            -ov -format UDZO \
            "dist/RibixIDE-${ARCH}.dmg"

      # ── Code signing & notarization (issue #60) ──────────────────────────────
      # Signs the macOS app with a Developer ID certificate and submits for notarization.
      # Requires secrets: MACOS_CERTIFICATE_P12 (base64-encoded), MACOS_CERTIFICATE_PASSWORD,
      # APPLE_ID, APPLE_ID_PASSWORD (app-specific password for notarization), APPLE_TEAM_ID
      # If secrets are not configured, signing is skipped (unsigned build).
      - name: Import signing certificate
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          CERT_FILE=$(mktemp /tmp/certificate.XXXXXX.p12)
          KEYCHAIN_FILE=$(mktemp /tmp/keychain.XXXXXX.keychain)
          echo "${{ secrets.MACOS_CERTIFICATE_P12 }}" | base64 -d > "$CERT_FILE"
          security create-keychain -p "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" "$KEYCHAIN_FILE"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_FILE"
          security unlock-keychain -p "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" "$KEYCHAIN_FILE"
          security import "$CERT_FILE" -P "${{ secrets.MACOS_CERTIFICATE_PASSWORD }}" -A -t cert -f pkcs12 -k "$KEYCHAIN_FILE"
          security list-keychain -d user -s "$KEYCHAIN_FILE"
          rm -f "$CERT_FILE"
          echo "KEYCHAIN_FILE=$KEYCHAIN_FILE" >> $GITHUB_ENV

      - name: Sign macOS app
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          APP_PATH="../VSCode-darwin-${{ matrix.arch }}/Ribix IDE.app"
          /usr/bin/codesign --force --deep --options runtime \
            --sign "Developer ID Application: ${{ secrets.APPLE_TEAM_ID }}" \
            "$APP_PATH"
        # #96: Removed continue-on-error — unsigned macOS builds must fail the release.

      - name: Notarize macOS app
        if: env.MACOS_CERTIFICATE_P12 != ''
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
        run: |
          DMG_PATH="dist/RibixIDE-${{ matrix.arch }}.dmg"
          xcrun notarytool submit "$DMG_PATH" \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --password "${{ secrets.APPLE_ID_PASSWORD }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --wait
          xcrun stapler staple "$DMG_PATH"
        # #96: Removed continue-on-error — unnotarized builds must fail the release.

      - name: Clean up keychain
        if: ${{ always() && env.KEYCHAIN_FILE != '' }}
        run: |
          security delete-keychain "$KEYCHAIN_FILE" 2>/dev/null || true
          rm -f "$KEYCHAIN_FILE"

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RibixIDE-${{ matrix.arch }}.dmg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-linux:
    name: Build Linux (x64)
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # Skip the TS->TS export mangler for release builds. It is a size optimization
      # only and a dependency .d.ts (google-auth-library) can crash it with OVERLAPPING edit.
      RIBIX_DISABLE_MANGLE: '1'
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential g++ \
            libx11-dev libxkbfile-dev \
            libsecret-1-dev libkrb5-dev \
            python3 python-is-python3 \
            fakeroot rpm

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci
        env:
          # @vscode/ripgrep downloads its binary from GitHub releases during
          # postinstall; without a token GitHub rate-limits with HTTP 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build React components
        run: npm run buildreact

      - name: Clean incremental build state
        run: find . -name '*.tsbuildinfo' -delete || true

      - name: Build Linux app
        run: node ./node_modules/gulp/bin/gulp.js vscode-linux-x64-min
        timeout-minutes: 45

      - name: Package as tar.gz
        run: |
          mkdir -p dist
          tar czf dist/RibixIDE-linux-x64.tar.gz -C .. VSCode-linux-x64

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RibixIDE-linux-x64.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-windows:
    name: Build Windows (x64)
    # Pinned to 2022: windows-latest ships a Visual Studio build that node-gyp
    # 10.x cannot detect ("unknown version undefined"), breaking native rebuilds.
    runs-on: windows-2022
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # Skip the TS->TS export mangler for release builds. It is a size optimization
      # only and a dependency .d.ts (google-auth-library) can crash it with OVERLAPPING edit.
      RIBIX_DISABLE_MANGLE: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Configure npm retries (avoid node-gyp EBUSY native rebuild lock)
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000
        shell: pwsh

      - name: Install dependencies
        run: npm ci
        env:
          # @vscode/ripgrep downloads its binary from GitHub releases during
          # postinstall; without a token GitHub rate-limits with HTTP 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build React components
        run: npm run buildreact

      - name: Clean incremental build state
        run: Get-ChildItem -Recurse -Filter '*.tsbuildinfo' | Remove-Item -Force -ErrorAction SilentlyContinue
        shell: pwsh

      - name: Build Windows app (x64)
        run: node ./node_modules/gulp/bin/gulp.js vscode-win32-x64-min
        timeout-minutes: 45
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Package as zip
        run: |
          mkdir -p dist
          Compress-Archive -Path ..\VSCode-win32-x64 -DestinationPath dist\RibixIDE-win32-x64.zip
        shell: pwsh

      # ── Code signing (issue #60) ────────────────────────────────────────────
      # Signs the Windows binary with an Authenticode certificate.
      # Requires secrets: WINDOWS_CERTIFICATE_PFX (base64-encoded), WINDOWS_CERTIFICATE_PASSWORD
      # If secrets are not configured, signing is skipped (unsigned build).
      - name: Decode signing certificate
        if: env.WINDOWS_CERTIFICATE_PFX != ''
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        run: |
          echo "${{ secrets.WINDOWS_CERTIFICATE_PFX }}" | base64 -d > cert.pfx
        shell: bash

      - name: Sign Windows binary
        if: env.WINDOWS_CERTIFICATE_PFX != ''
        env:
          WINDOWS_CERTIFICATE_PFX: ${{ secrets.WINDOWS_CERTIFICATE_PFX }}
        run: |
          signtool sign /f cert.pfx /p "${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}" \
            /tr http://timestamp.digicert.com /td sha256 /fd sha256 \
            "..\VSCode-win32-x64\Ribix IDE.exe"
        shell: cmd
        # #96: Removed continue-on-error — unsigned Windows builds must fail the release.

      - name: Clean up certificate
        if: ${{ always() }}
        run: rm -f cert.pfx
        shell: bash

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/RibixIDE-win32-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
