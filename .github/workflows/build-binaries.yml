name: Build Pre-built Binaries

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
        node: [20.18.2]
    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install dependencies
        run: npm ci

      - name: Install build dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev python-is-python3

      - name: Build React components
        run: npm run buildreact

      - name: Compile TypeScript
        run: npm run compile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download Electron
        run: node build/lib/preLaunch.js

      - name: Create distribution (Windows)
        if: matrix.os == 'windows-latest'
        run: npm run package -- --win --x64

      - name: Create distribution (macOS)
        if: matrix.os == 'macos-latest'
        run: npm run package -- --mac --x64 --arm64

      - name: Create distribution (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: npm run package -- --linux --x64

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ribix-ide-${{ matrix.os }}
          path: |
            *.exe
            *.dmg
            *.deb
            *.rpm
            *.AppImage

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: ./dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}