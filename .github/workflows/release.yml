name: Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'

# Required for softprops/action-gh-release to create/update releases and
# upload assets; without this the upload fails with 403.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: macos
          # Pinned to 2022: windows-latest ships a Visual Studio build that
          # node-gyp 10.x cannot detect ("unknown version undefined"), breaking
          # native rebuilds.
          - os: windows-2022
            platform: windows

    runs-on: ${{ matrix.os }}

    env:
      NODE_OPTIONS: --max-old-space-size=8192
      # Skip the TS->TS export mangler; a dependency .d.ts (google-auth-library)
      # can crash it with OVERLAPPING edit. Size optimization only.
      RIBIX_DISABLE_MANGLE: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            build-essential g++ \
            libx11-dev libxkbfile-dev \
            libsecret-1-dev libkrb5-dev \
            python3 python-is-python3

      - uses: actions/setup-node@v4
        with:
          node-version: '20.18.2'
          cache: 'npm'

      - name: Configure npm retries (Windows — aRIBIXs node-gyp EBUSY lock)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          npm config set fetch-retries 5
          npm config set fetch-retry-maxtimeout 120000

      - name: Install dependencies
        run: npm ci
        env:
          # @vscode/ripgrep downloads its binary from GitHub releases during
          # postinstall; without a token GitHub rate-limits with HTTP 403.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build React components
        run: npm run buildreact

      - name: Clean incremental build state (Linux/macOS)
        if: matrix.platform != 'windows'
        run: find . -name '*.tsbuildinfo' -delete || true

      - name: Clean incremental build state (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Get-ChildItem -Recurse -Filter '*.tsbuildinfo' | Remove-Item -Force -ErrorAction SilentlyContinue

      - name: Compile
        run: npm run compile
        timeout-minutes: 30
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # --- Tag-only: generate checksums and upload release assets ------------

      - name: Generate SHA256 checksums (Linux/macOS)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform != 'windows'
        shell: bash
        run: |
          mkdir -p dist
          # Collect compiled output files (adjust glob if packaging adds more artifacts)
          if compgen -G "out/**" > /dev/null 2>&1; then
            find out -type f | sort | xargs sha256sum > dist/sha256sums-${{ matrix.platform }}.txt
          else
            echo "No out/ artifacts found — skipping checksum" > dist/sha256sums-${{ matrix.platform }}.txt
          fi
          cat dist/sha256sums-${{ matrix.platform }}.txt

      - name: Generate SHA256 checksums (Windows)
        if: startsWith(github.ref, 'refs/tags/v') && matrix.platform == 'windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $outItems = Get-ChildItem -Path out -Recurse -File -ErrorAction SilentlyContinue
          if ($outItems) {
            $results = $outItems | ForEach-Object {
              $hash = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
              "$hash  $($_.FullName)"
            }
            $results | Out-File -FilePath dist\sha256sums-windows.txt -Encoding utf8
          } else {
            "No out/ artifacts found — skipping checksum" | Out-File -FilePath dist\sha256sums-windows.txt -Encoding utf8
          }
          Get-Content dist\sha256sums-windows.txt

      - name: Upload checksum to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/sha256sums-${{ matrix.platform }}.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
