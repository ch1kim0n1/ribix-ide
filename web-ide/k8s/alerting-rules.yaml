            severity: critical
            namespace: ribix-ide
          annotations:
            summary: "Pod {{ $labels.pod }} is not Ready"
            description: "Pod {{ $labels.pod }} has been in a non-Ready state for more than 5 minutes."
            runbook_url: "https://github.com/ribix/ribix-ide/blob/main/docs/monitoring-setup.md#podnotready"

    - name: ribix-ide-resources
      interval: 30s
      rules:
        - alert: HighCPUUsage
          expr: |
            sum(rate(container_cpu_usage_seconds_total{namespace="ribix-ide",container!="POD",container!=""}[5m])) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="ribix-ide",resource="cpu"}) by (pod)
            > 0.80
          for: 10m
          labels:
            severity: warning
            namespace: ribix-ide
          annotations:
            summary: "High CPU usage on pod {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} CPU usage is {{ $value | humanizePercentage }} of its limit (threshold 80%) for the last 10 minutes."
            runbook_url: "https://github.com/ribix/ribix-ide/blob/main/docs/monitoring-setup.md#highcpuusage"

        - alert: HighMemoryUsage
          expr: |
            sum(container_memory_working_set_bytes{namespace="ribix-ide",container!="POD",container!=""}) by (pod)
            /
            sum(kube_pod_container_resource_limits{namespace="ribix-ide",resource="memory"}) by (pod)
            > 0.85
          for: 10m
          labels:
            severity: warning
            namespace: ribix-ide
          annotations:
            summary: "High memory usage on pod {{ $labels.pod }}"
            description: "Pod {{ $labels.pod }} memory usage is {{ $value | humanizePercentage }} of its limit (threshold 85%) for the last 10 minutes."
            runbook_url: "https://github.com/ribix/ribix-ide/blob/main/docs/monitoring-setup.md#highmemoryusage"

    - name: ribix-ide-websocket
      interval: 30s
      rules:
        - alert: WebSocketServerDown
          expr: |
            up{job="ribix-ide-websocket"} == 0
          for: 2m
          labels:
            severity: critical
            service: ribix-ide-websocket
            namespace: ribix-ide
          annotations:
            summary: "WebSocket server {{ $labels.pod }} is down"
            description: "The ribix-ide-websocket health endpoint on pod {{ $labels.pod }} has been failing for 2 minutes."
            runbook_url: "https://github.com/ribix/ribix-ide/blob/main/docs/monitoring-setup.md#websocketserverdown"

    - name: ribix-ide-certificates
      interval: 5m
      rules:
        - alert: CertificateExpiringSoon
          expr: |
            certmanager_certificate_expiration_timestamp_seconds{secret_name="ribix-ide-tls"}
              - time() < 14 * 24 * 3600
          for: 10m
          labels:
            severity: warning
            namespace: ribix-ide
          annotations:
            summary: "TLS certificate expiring soon"
            description: "Certificate {{ $labels.name }} in namespace {{ $labels.namespace }} expires in less than 14 days."
            runbook_url: "https://github.com/ribix/ribix-ide/blob/main/docs/monitoring-setup.md#certificateexpiringsoon"

    - name: ribix-ide-ingress
      interval: 30s
      rules:
        - alert: IngressBackendErrors
          expr: |
            sum(rate(nginx_ingress_controller_requests{namespace="ribix-ide",status=~"5.."}[5m]))
            /
            sum(rate(nginx_ingress_controller_requests{namespace="ribix-ide"}[5m]))
            > 0.01
          for: 5m
          labels:
            severity: warning
            namespace: ribix-ide
          annotations:
            summary: "Ingress backend 5xx errors"
            description: "Ingress 5xx error rate is {{ $value | humanizePercentage }} (threshold 1%) for ribix-ide backends over the last 5 minutes."
            runbook_url: "https://github.com/ribix/ribix-ide/blob/main/docs/monitoring-setup.md#ingressbackenderrors"

    - name: ribix-ide-nodes
      interval: 1m
      rules:
        - alert: DiskPressure
          expr: |
            (1 - node_filesystem_avail_bytes{fstype!~"tmpfs|overlay"}
                / node_filesystem_size_bytes{fstype!~"tmpfs|overlay"}) * 100 > 85
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Disk pressure on {{ $labels.instance }}"
            description: "Filesystem {{ $labels.mountpoint }} on {{ $labels.instance }} is {{ $value | printf \"%.0f\" }}% full (threshold 85%)."
            runbook_url: "https://github.com/ribix/ribix-ide/blob/main/docs/monitoring-setup.md#diskpressure"
