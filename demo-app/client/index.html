<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout Demo</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }

    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 2rem;
      letter-spacing: -0.02em;
      color: #f8fafc;
    }

    h2 {
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #94a3b8;
      margin-bottom: 1rem;
    }

    .layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.5rem;
      width: 100%;
      max-width: 860px;
    }

    @media (max-width: 600px) {
      .layout { grid-template-columns: 1fr; }
    }

    .panel {
      background: #1e2130;
      border: 1px solid #2d3148;
      border-radius: 12px;
      padding: 1.5rem;
    }

    .product-list {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .product-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.875rem 1rem;
      background: #252840;
      border: 1px solid #2d3148;
      border-radius: 8px;
    }

    .product-name {
      font-weight: 500;
      font-size: 0.95rem;
    }

    .product-price {
      color: #94a3b8;
      font-size: 0.875rem;
      margin-top: 0.125rem;
    }

    .btn {
      padding: 0.5rem 1rem;
      border-radius: 6px;
      border: none;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    .btn:hover { opacity: 0.85; }

    .btn-add {
      background: #3b5bdb;
      color: #fff;
    }

    .btn-checkout {
      width: 100%;
      padding: 0.75rem;
      font-size: 0.95rem;
      background: #2f9e44;
      color: #fff;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: 600;
      margin-top: 1rem;
      /* BUG UI-P1: no loading/disabled state — user can double-submit while request is in flight */
      transition: opacity 0.15s;
    }

    .btn-checkout:hover { opacity: 0.85; }

    .cart-items {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      min-height: 3rem;
    }

    .cart-item {
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      padding: 0.375rem 0;
      border-bottom: 1px solid #2d3148;
      color: #cbd5e1;
    }

    .cart-empty {
      color: #475569;
      font-size: 0.875rem;
      text-align: center;
      padding: 1rem 0;
    }

    .cart-total {
      display: flex;
      justify-content: space-between;
      font-weight: 700;
      font-size: 1rem;
      margin-top: 1rem;
      padding-top: 0.75rem;
      border-top: 1px solid #2d3148;
      color: #f8fafc;
    }

    .status-bar {
      width: 100%;
      max-width: 860px;
      margin-top: 1.5rem;
      padding: 0.875rem 1.25rem;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }

    .status-bar.show { display: block; }
    .status-bar.success { background: #14532d; border: 1px solid #16a34a; color: #86efac; }
    .status-bar.error   { background: #450a0a; border: 1px solid #dc2626; color: #fca5a5; }

    .login-section {
      width: 100%;
      max-width: 860px;
      margin-top: 1.5rem;
    }

    .login-form {
      display: flex;
      gap: 0.75rem;
      align-items: flex-end;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 0.375rem;
      flex: 1;
    }

    label {
      font-size: 0.8rem;
      font-weight: 500;
      color: #94a3b8;
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    input {
      padding: 0.5rem 0.75rem;
      background: #252840;
      border: 1px solid #2d3148;
      border-radius: 6px;
      color: #e2e8f0;
      font-size: 0.9rem;
      /* BUG UI-P2: form data not persisted to sessionStorage — back-navigation clears inputs */
    }

    input:focus {
      outline: none;
      border-color: #3b5bdb;
    }

    .btn-login {
      background: #7c3aed;
      color: #fff;
      padding: 0.5rem 1.25rem;
      white-space: nowrap;
    }

    .token-display {
      margin-top: 0.75rem;
      padding: 0.625rem 0.875rem;
      background: #1a1f35;
      border: 1px solid #2d3148;
      border-radius: 6px;
      font-family: monospace;
      font-size: 0.8rem;
      color: #7dd3fc;
      display: none;
    }

    .token-display.show { display: block; }

    .bug-badge {
      display: inline-block;
      padding: 0.125rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-left: 0.5rem;
      vertical-align: middle;
    }

    .p0 { background: #7f1d1d; color: #fca5a5; }
    .p1 { background: #713f12; color: #fde68a; }
    .p2 { background: #1e3a5f; color: #93c5fd; }
    .p3 { background: #1f2937; color: #9ca3af; }
  </style>
</head>
<body>
  <h1>Checkout Demo <span style="font-size:0.85rem;color:#475569;font-weight:400;">(intentional bugs)</span></h1>

  <div class="layout">
    <!-- Products panel -->
    <div class="panel">
      <h2>Products</h2>
      <div class="product-list" id="product-list">
        <div class="cart-empty">Loading products…</div>
      </div>
    </div>

    <!-- Cart panel -->
    <div class="panel">
      <h2>Cart</h2>
      <div class="cart-items" id="cart-items">
        <div class="cart-empty">Your cart is empty</div>
      </div>
      <div class="cart-total" id="cart-total" style="display:none;">
        <span>Total</span>
        <span id="total-amount">$0.00</span>
      </div>
      <!--
        BUG UI-P3 (P2 severity): no confirmation dialog before checkout.
        Clicking "Checkout" immediately fires POST /api/checkout with no "Are you sure?" prompt.
        If cart is empty this will also trigger the P0 server crash.
      -->
      <button class="btn-checkout" id="checkout-btn" onclick="checkout()">Checkout</button>
    </div>
  </div>

  <!-- Login section (demonstrates auth bypass bug) -->
  <div class="login-section panel" style="margin-top:1.5rem;">
    <h2>Admin Login <span class="bug-badge p1">P1 — auth bypass</span></h2>
    <div class="login-form">
      <div class="field">
        <label>Username</label>
        <input type="text" id="username" placeholder="admin" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" placeholder="any password works" />
      </div>
      <button class="btn btn-login" onclick="login()">Login</button>
    </div>
    <div class="token-display" id="token-display"></div>
  </div>

  <div class="status-bar" id="status-bar"></div>

  <script>
    const API = 'http://localhost:3001';
    let localCart = [];

    // ---- Products ----
    async function loadProducts() {
      // BUG P2 (server): fetches all products with no pagination
      const res = await fetch(`${API}/api/products`);
      const products = await res.json();
      const list = document.getElementById('product-list');
      list.innerHTML = '';
      products.forEach(p => {
        const el = document.createElement('div');
        el.className = 'product-item';
        el.innerHTML = `
          <div>
            <div class="product-name">${p.name}</div>
            <div class="product-price">$${p.price.toFixed(2)}</div>
          </div>
          <button class="btn btn-add" onclick="addToCart(${p.id}, '${p.name}', ${p.price})">Add</button>
        `;
        list.appendChild(el);
      });
    }

    // ---- Cart ----
    function addToCart(id, name, price) {
      localCart.push({ id, name, price, quantity: 1 });
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById('cart-items');
      const totalRow = document.getElementById('cart-total');
      const totalAmt = document.getElementById('total-amount');

      if (localCart.length === 0) {
        container.innerHTML = '<div class="cart-empty">Your cart is empty</div>';
        totalRow.style.display = 'none';
        return;
      }

      container.innerHTML = '';
      let total = 0;
      localCart.forEach(item => {
        total += item.price * item.quantity;
        const el = document.createElement('div');
        el.className = 'cart-item';
        el.innerHTML = `<span>${item.name} × ${item.quantity}</span><span>$${(item.price * item.quantity).toFixed(2)}</span>`;
        container.appendChild(el);
      });
      totalRow.style.display = 'flex';
      totalAmt.textContent = `$${total.toFixed(2)}`;
    }

    // ---- Checkout ----
    // BUG UI-P1: no loading state — the button stays enabled while the request is in flight.
    // BUG UI-P3: no confirmation dialog — fires immediately on click.
    async function checkout() {
      // First add items to server cart so /api/checkout has something to reduce
      for (const item of localCart) {
        await fetch(`${API}/api/cart/add`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ productId: item.id, quantity: item.quantity }),
        });
      }

      // BUG P0 (server): if localCart is empty, the server cart is also empty and reduce crashes
      const res = await fetch(`${API}/api/checkout`, { method: 'POST' });
      const data = await res.json();

      if (res.ok) {
        localCart = [];
        renderCart();
        showStatus(`Order placed! ID: ${data.orderId} — Total: $${data.total?.toFixed(2)}`, 'success');
      } else {
        // BUG P3 (server): error response may contain stack trace, displayed here for demo visibility
        showStatus(`Checkout failed: ${data.error}${data.stack ? '\n\nStack trace exposed:\n' + data.stack.split('\n')[1] : ''}`, 'error');
      }
    }

    // ---- Login (auth bypass demo) ----
    async function login() {
      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      // BUG UI-P2: username/password not saved to sessionStorage — back-navigation clears form
      const res = await fetch(`${API}/api/login`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      const tokenEl = document.getElementById('token-display');
      if (res.ok) {
        tokenEl.textContent = `Token: ${data.token}  |  Role: ${data.role}`;
        tokenEl.classList.add('show');
        showStatus(`Logged in as ${username} — password was never validated`, 'success');
      } else {
        tokenEl.classList.remove('show');
        showStatus(`Login failed: ${data.error}`, 'error');
      }
    }

    function showStatus(msg, type) {
      const bar = document.getElementById('status-bar');
      bar.textContent = msg;
      bar.className = `status-bar show ${type}`;
    }

    // Init
    loadProducts();
  </script>
</body>
</html>
