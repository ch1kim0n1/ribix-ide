events {
    worker_connections 1024;
}

http {
    upstream ribix-web {
        server ribix-web:3000;
    }

    upstream ribix-ide-web {
        server ribix-ide-web:3000;
    }

    upstream ribix-backend {
        server ribix-backend:3000;
    }

    upstream ribix-websocket {
        server ribix-websocket:1234;
    }

    proxy_cache_path /var/cache/nginx/marketplace levels=1:2 keys_zone=marketplace_cache:10m inactive=10m max_size=100m;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=general:10m rate=30r/s;

    server {
        listen 80;
        server_name ide.ribix.dev;

        # Redirect to HTTPS
        return 301 https://$server_name$request_uri;
    }

    server {
        listen 443 ssl http2;
        server_name ide.ribix.dev;

        ssl_certificate /etc/nginx/ssl/cert.pem;
        ssl_certificate_key /etc/nginx/ssl/key.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;

        # Security headers
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Gzip compression
        gzip on;
        gzip_vary on;
        gzip_min_length 1024;
        gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

        # Ribix Web (Dashboard)
        location / {
            limit_req zone=general burst=50 nodelay;
            proxy_pass http://ribix-web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Ribix IDE Web
        location /ide/ {
            limit_req zone=general burst=50 nodelay;
            rewrite ^/ide/(.*) /$1 break;
            proxy_pass http://ribix-ide-web;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache_bypass $http_upgrade;
        }

        # Backend endpoints used by the web IDE frontend.
        location /web-ide/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ribix-backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Marketplace proxy for the web IDE to avoid browser CORS failures.
        location = /web-ide/marketplace/query {
            limit_req zone=api burst=20 nodelay;
            proxy_pass https://marketplace.visualstudio.com/_apis/public/gallery/extensionquery;
            proxy_http_version 1.1;
            proxy_set_header Host marketplace.visualstudio.com;
            proxy_set_header User-Agent ribix-ide/nginx;
            proxy_set_header Accept "application/json;api-version=7.2-preview.1";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_cache marketplace_cache;
            proxy_cache_methods GET POST;
            proxy_cache_key "$request_method|$scheme://$host$request_uri|$request_body";
            proxy_cache_valid 200 5m;
        }

        location = /web-ide/marketplace/health {
            access_log off;
            return 204;
        }

        # WebSocket for collaboration
        location /collaboration {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ribix-websocket;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 86400;
        }

        # API routes
        location /api/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://ribix-backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Health check endpoint
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # Static files caching
        location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }
}
